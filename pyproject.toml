[project]
name = "bucketlist-cli"
version = "0.1.0"
description = "A local SQLite-backed bucket list CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13",
  "typer>=0.12",
]

[project.scripts]
bucket = "bucket.main:app"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["bucket*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
